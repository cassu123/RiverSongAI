version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Capped <15.0 in requirements.txt for Home Assistant proxy and
      # google-genai compatibility. Bound the ignore to the majors that break
      # us so 14.x security patches still come through.
      - dependency-name: "websockets"
        versions: [">= 15.0.0"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly

  # Capacitor wraps the frontend into a native Android app, so frontend/android
  # carries a real Gradle build: the Android Gradle Plugin and the Google
  # Services plugin that wires up FCM push. Dependabot raises security alerts
  # for these whether or not they are configured here — without this block the
  # alerts appear and nothing ever opens a PR to act on them.
  - package-ecosystem: gradle
    directory: /frontend/android
    schedule:
      interval: weekly
