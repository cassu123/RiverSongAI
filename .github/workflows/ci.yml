name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies (skip speexdsp — needs swig, wake-word only)
        run: |
          grep -v '^speexdsp' requirements.txt > /tmp/req-ci.txt
          pip install -r /tmp/req-ci.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest -q

  # Parse-only, no dependencies, no tests. An autoformatter once wrapped
  # expressions inside f-string braces -- PEP 701 syntax that only parses on
  # 3.12+ -- and silently made 25 modules unimportable on anything older.
  # Nothing needed that syntax, and the tests all run on 3.13, so the breakage
  # was invisible. This catches it coming back.
  syntax-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q -x '(node_modules|frontend|__pycache__)' .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
